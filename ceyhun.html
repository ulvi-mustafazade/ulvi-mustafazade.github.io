:root{
  --navy:#07152e;
  --gold:#d5ad57;
  --gold2:#f0d48b;
  --ink:#10253f;
  --paper:#f7f3e9
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:#07152e;
  color:#10253f;
  font-family:system-ui,sans-serif
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  background:#f7f3e9;
  padding-top:env(safe-area-inset-top,0px)
}

.topbar{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:30;
  height:72px;
  background:#06132a;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  border:0;
  background:none;
  color:#fff;
  text-align:left
}

.brand-mark{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:1px solid #d5ad57;
  border-radius:50%;
  color:#d5ad57
}

.brand-text{
  display:flex;
  flex-direction:column
}

.brand-text small{
  font-size:9px;
  letter-spacing:.2em;
  color:#cbb26f
}

.brand-text strong{
  font-family:Georgia,serif;
  font-size:18px
}

.desktop-nav{
  display:flex;
  gap:16px
}

.desktop-nav button{
  border:0;
  background:none;
  color:#e8e4d7;
  font-size:13px
}

.desktop-nav button.nav-active{
  color:#f0d48b;
  text-decoration:underline;
  text-underline-offset:6px;
  font-weight:800
}

.header-cta{
  background:#d5ad57;
  color:#07152e;
  border:0;
  border-radius:999px;
  padding:10px 16px;
  font-weight:800
}

.hero{
  background:#0a2247;
  color:#fff;
  overflow-x:clip
}

.hero-inner{
  max-width:1280px;
  margin:auto;
  padding:48px 20px 60px;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:40px;
  align-items:center
}

.flag-line{
  display:flex;
  height:5px;
  width:150px;
  overflow:hidden;
  border-radius:99px
}

.flag-line i{
  flex:1
}

.flag-line i:nth-child(1){
  background:#00a3e1
}

.flag-line i:nth-child(2){
  background:#ed2a2e
}

.flag-line i:nth-child(3){
  background:#009b4b
}

.eyebrow{
  color:#e8c97f;
  font-size:12px;
  font-weight:700
}

.hero-slogan{
  font-family:Georgia,serif;
  font-style:italic;
  font-size:32px;
  color:#ead391;
  margin:12px 0 6px
}

.hero h1{
  font-family:Georgia,serif;
  font-size:64px;
  line-height:.95;
  margin:0
}

.hero h1 span{
  color:#f0d48b;
  font-style:italic
}

.hero-subtitle{
  font-size:21px;
  font-weight:600
}

.hero-desc{
  color:#bdc9dc;
  line-height:1.7
}

.hero-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap
}

.btn-gold,.btn-outline{
  border-radius:999px;
  padding:13px 20px;
  display:inline-flex;
  gap:8px;
  align-items:center;
  font-weight:800
}

.btn-gold{
  background:#d5ad57;
  color:#07152e;
  border:0
}

.btn-outline{
  border:1px solid #fff;
  background:transparent;
  color:#fff
}

.hero-meta{
  display:flex;
  gap:20px;
  color:#aebacd;
  font-size:13px
}

.hero-meta span{
  display:flex;
  gap:6px;
  align-items:center
}

.portrait-wrap{
  position:relative
}

.portrait-frame{
  background:#fff7e5;
  color:#15263c;
  border:1px solid #c9a85c;
  padding:12px
}

.portrait-top{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:.2em;
  font-weight:800;
  padding:4px 3px 10px
}

.silhouette{
  height:400px;
  background:#102b54;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center
}

.silhouette-person{
  position:absolute;
  width:200px;
  height:260px;
  bottom:0;
  background:#040d1f;
  border-radius:120px 120px 0 0
}

.photo-note{
  position:relative;
  text-align:center;
  padding:24px;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px
}

.photo-note strong{
  font-family:Georgia,serif;
  font-size:21px
}

.portrait-bottom{
  padding:12px 4px 2px;
  display:flex;
  flex-direction:column
}

.floating-quote{
  position:absolute;
  left:-20px;
  bottom:36px;
  background:#07152e;
  border-left:3px solid #d5ad57;
  color:#fff;
  padding:15px;
  width:280px;
  display:flex;
  gap:9px
}

.scroll-hint{
  border:0;
  background:none;
  color:#aebacd;
  display:flex;
  gap:5px;
  align-items:center
}

.quick-section,.life-section,.timeline-section,.memory-section,.union-section,.media-section,.news-section,.join-section{
  max-width:1280px;
  margin:auto;
  padding:48px 20px
}

.section-label,.section-head>span{
  color:#967b2b;
  font-size:11px;
  letter-spacing:.18em;
  font-weight:800
}

.section-head h2,.life-copy h2,.union-grid h2,.join-copy h2{
  font-family:Georgia,serif;
  font-size:44px;
  line-height:1.05;
  margin:10px 0
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.quick-card{
  background:#fff;
  border:1px solid #e5dcc5;
  padding:20px
}

.quick-card h3{
  font-family:Georgia,serif;
  font-size:22px
}

.quick-card small{
  color:#7a8796
}

.life-grid,.union-grid,.join-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:36px
}

.lead{
  font-size:18px;
  line-height:1.55
}

.life-points{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.life-quote-card{
  background:#07152e;
  color:#fff;
  padding:30px
}

.life-quote-card blockquote{
  font-family:Georgia,serif;
  font-size:32px
}

.invitation{
  background:#fff;
  border:1px solid #ddd2b5;
  padding:18px;
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  margin-top:24px
}

.invitation>div{
  display:flex;
  gap:12px
}

.invitation button{
  border:0;
  background:none;
  color:#8a6d21;
  font-weight:800
}

.timeline-section{
  background:#07152e;
  color:#fff;
  max-width:none
}

.timeline{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.timeline-item{
  border-top:1px solid #ffffff2e;
  padding-top:18px
}

.timeline-content h3{
  font-family:Georgia,serif;
  font-size:22px
}

.timeline-content p{
  color:#b4c0d0
}

.memory-head{
  display:flex;
  justify-content:space-between;
  gap:20px
}

.memory-tabs{
  display:flex;
  gap:8px;
  margin:20px 0
}

.memory-tabs button{
  border:1px solid #d8cfae;
  background:#fff;
  padding:10px 16px;
  border-radius:99px
}

.memory-tabs button.active{
  background:#07152e;
  color:#fff
}

.memory-stage{
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:12px
}

.memory-big{
  background:#fff;
  border:1px solid #ddd2b5;
  padding:24px;
  display:flex;
  gap:20px
}

.memory-big>span{
  width:70px;
  height:70px;
  flex:0 0 70px;
  border-radius:50%;
  background:#f3e9c9;
  display:grid;
  place-items:center;
  font-family:Georgia,serif;
  font-size:30px
}

.memory-list{
  display:flex;
  flex-direction:column;
  gap:10px
}

.memory-list button{
  border:1px solid #ddd2b5;
  background:#fff;
  padding:15px;
  text-align:left;
  display:flex;
  gap:12px;
  align-items:center
}

.memory-list button.selected{
  background:#07152e;
  color:#fff
}

.union-section{
  background:#fff
}

.mission-cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.mission-cards>div{
  background:#f7f3e9;
  border:1px solid #e8ddc2;
  padding:18px
}

.activity-card{
  background:#07152e;
  color:#fff;
  padding:26px
}

.activity-card ul{
  list-style:none;
  padding:0
}

.activity-card li{
  padding:12px 0;
  border-top:1px solid #ffffff22;
  display:flex;
  gap:10px
}

.activity-foot{
  background:#d5ad5722;
  padding:14px;
  margin-top:14px
}

.media-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:24px
}

.media-tile{
  height:210px;
  border:1px dashed #a99e7c;
  background:#fff8e5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:18px
}

.media-tile.selected{
  outline:3px solid #d5ad57
}

.media-selected{
  background:#07152e;
  color:#fff;
  font-size:11px;
  padding:5px 8px
}

.media-note{
  color:#697789
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:22px
}

.news-card{
  background:#fff;
  border:1px solid #ddd2b5;
  padding:18px
}

.news-visual{
  height:150px;
  background:#10294f;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}

.news-card button,.text-button{
  border:0;
  background:none;
  color:#8a6d21;
  font-weight:800
}

.section-head.split{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:end
}

.join-section{
  background:#07152e;
  color:#fff;
  max-width:none
}

.join-copy>p{
  color:#aebacd
}

.contact-list{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:24px
}

.contact-list>div{
  display:flex;
  gap:10px
}

.contact-list span{
  display:flex;
  flex-direction:column
}

.local-note{
  border:1px solid #ffffff2e;
  padding:14px;
  margin-top:24px
}

.join-form{
  background:#fff;
  color:#10253f;
  padding:24px
}

.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.join-form label{
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:13px;
  font-weight:700;
  margin-bottom:12px
}

.join-form input,.join-form textarea{
  border:1px solid #c8c1a9;
  padding:11px;
  width:100%
}

.full{
  width:100%;
  justify-content:center
}

.preview-box{
  background:#f7f3e9;
  border:1px solid #d8cfae;
  padding:14px;
  margin-top:12px
}

.preview-box button{
  border:0;
  background:none;
  color:#8a6d21;
  font-weight:800
}

footer{
  background:#040d1f;
  color:#d7dee8;
  padding:36px 20px 20px
}

.footer-main{
  max-width:1280px;
  margin:auto;
  display:grid;
  grid-template-columns:1.2fr 1fr .8fr;
  gap:24px
}

.footer-brand{
  display:flex;
  gap:10px
}

.footer-main nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px 16px
}

.footer-main nav button{
  border:0;
  background:none;
  color:#c5cfdc
}

.copyright{
  max-width:1280px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  padding-top:18px
}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#07152e;
  color:#fff;
  border-left:3px solid #d5ad57;
  padding:12px 14px;
  display:flex;
  gap:14px;
  z-index:50;
  max-width:92vw
}

.toast button{
  border:0;
  background:none;
  color:#fff;
  font-size:22px
}

@media(max-width:900px){
  .desktop-nav{
    display:none
  }

  .hero-inner{
    grid-template-columns:1fr
  }
}

@media(max-width:560px){
  .quick-grid{
    grid-template-columns:1fr
  }
}
