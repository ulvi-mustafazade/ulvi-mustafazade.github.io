:root{
  --navy:#050b1a;
  --navy-2:#0a1730;
  --navy-3:#12264d;
  --gold:#e2b95c;
  --gold-2:#f6df9a;
  --gold-deep:#9a7428;
  --ink:#101a2c;
  --paper:#f6f5f1;
  --card:#ffffff;
  --muted:#667085;
  --line:rgba(16,26,44,.11);
  --shadow:0 18px 45px rgba(5,11,26,.10)
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--navy);
  color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased
}

button{
  cursor:pointer;
  font-family:inherit
}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:2px
}

.app-shell{
  min-height:100vh;
  background:var(--paper);
  padding-top:env(safe-area-inset-top,0px);
  overflow-x:clip
}

.topbar{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:40;
  min-height:72px;
  background:rgba(4,10,24,.86);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:12px 24px;
  border-bottom:1px solid rgba(255,255,255,.09)
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  background:none;
  color:#fff;
  text-align:left;
  padding:0
}

.brand-mark{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,#f6df9a,#d9a93f);
  color:#07122a;
  box-shadow:0 8px 22px rgba(217,169,63,.35)
}

.brand-text{
  display:flex;
  flex-direction:column;
  gap:2px
}

.brand-text small{
  font-size:9px;
  line-height:1.3;
  letter-spacing:.16em;
  color:#d8c47e;
  font-weight:800
}

.brand-text strong{
  font-family:"Fraunces",Georgia,serif;
  font-size:19px;
  line-height:1.1;
  font-weight:600
}

.desktop-nav{
  display:flex;
  gap:4px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  padding:4px;
  border-radius:999px
}

.desktop-nav button{
  border:0;
  background:none;
  color:#d9dee8;
  font-size:13px;
  font-weight:700;
  padding:9px 14px;
  border-radius:999px;
  transition:.2s
}

.desktop-nav button:hover{
  color:#fff;
  background:rgba(255,255,255,.08)
}

.desktop-nav button.nav-active{
  color:#07122a;
  background:linear-gradient(135deg,#f6df9a,#e2b95c);
  box-shadow:0 4px 14px rgba(226,185,92,.3)
}

.header-cta{
  background:linear-gradient(135deg,#f6df9a,#e2b95c);
  color:#07122a;
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-weight:800;
  font-size:14px;
  box-shadow:0 8px 20px rgba(226,185,92,.25);
  transition:.2s
}

.header-cta:hover{
  transform:translateY(-1px)
}

.mobile-nav{
  display:none
}

.hero{
  position:relative;
  background:radial-gradient(900px 420px at 85% 8%,rgba(226,185,92,.24),transparent 60%),radial-gradient(700px 500px at 8% 90%,rgba(0,163,225,.16),transparent 55%),linear-gradient(135deg,#040a1c 0%,#071a3b 52%,#0a2146 100%);
  color:#fff;
  overflow-x:clip
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 78% 68%,rgba(255,255,255,.05) 0 1px,transparent 1.5px) 0 0/28px 28px;
  opacity:.5;
  pointer-events:none
}

.hero-inner{
  position:relative;
  max-width:1220px;
  margin:auto;
  padding:68px 24px 76px;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:56px;
  align-items:center
}

.flag-line{
  display:flex;
  height:5px;
  width:132px;
  overflow:hidden;
  border-radius:99px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12)
}

.flag-line i{
  flex:1
}

.flag-line i:nth-child(1){
  background:#00a3e1
}

.flag-line i:nth-child(2){
  background:#ed2a2e
}

.flag-line i:nth-child(3){
  background:#009b4b
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#f2d98d;
  font-size:11px;
  line-height:1.45;
  font-weight:800;
  letter-spacing:.11em;
  background:rgba(226,185,92,.12);
  border:1px solid rgba(226,185,92,.28);
  padding:9px 13px;
  border-radius:999px;
  max-width:100%
}

.dot{
  width:7px;
  height:7px;
  flex:0 0 7px;
  border-radius:50%;
  background:#e2b95c;
  box-shadow:0 0 0 5px rgba(226,185,92,.18)
}

.hero-slogan{
  font-family:"Fraunces",Georgia,serif;
  font-style:italic;
  font-weight:600;
  font-size:clamp(30px,4vw,44px);
  line-height:1.05;
  background:linear-gradient(90deg,#fff,#f6df9a);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin:22px 0 10px
}

.hero h1{
  font-family:"Fraunces",Georgia,serif;
  font-size:clamp(48px,6.2vw,76px);
  line-height:.98;
  letter-spacing:-.025em;
  margin:0;
  font-weight:600
}

.hero h1 span{
  color:#f0d48b;
  font-style:italic
}

.hero-subtitle{
  font-size:19px;
  font-weight:700;
  margin:18px 0 0
}

.hero-desc{
  color:#c2cbda;
  line-height:1.75;
  font-size:16.5px;
  max-width:56ch
}

.hero-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:28px
}

.btn-gold,.btn-outline{
  border-radius:999px;
  padding:14px 22px;
  display:inline-flex;
  gap:9px;
  align-items:center;
  font-weight:800;
  font-size:15px;
  transition:.2s
}

.btn-gold{
  background:linear-gradient(135deg,#f6df9a,#e2b95c);
  color:#07122a;
  border:0;
  box-shadow:0 12px 26px rgba(226,185,92,.28)
}

.btn-gold:hover{
  transform:translateY(-2px)
}

.btn-outline{
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(8px);
  color:#fff
}

.btn-outline:hover{
  background:rgba(255,255,255,.12)
}

.hero-meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  color:#dbe1ec;
  font-size:13px;
  margin-top:24px
}

.hero-meta span{
  display:inline-flex;
  gap:7px;
  align-items:center;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.09);
  padding:8px 12px;
  border-radius:999px
}

.hero-stats{
  display:flex;
  gap:28px;
  flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.14);
  padding-top:22px;
  margin-top:28px
}

.hero-stats div{
  display:flex;
  flex-direction:column;
  gap:3px
}

.hero-stats strong{
  font-family:"Fraunces",Georgia,serif;
  font-size:28px;
  color:#f6df9a
}

.hero-stats small{
  color:#9fa9ba;
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase
}

.portrait-wrap{
  position:relative
}

.portrait-frame{
  background:#fff;
  color:#15263c;
  border:1px solid rgba(226,185,92,.45);
  padding:13px;
  border-radius:28px;
  box-shadow:0 34px 70px rgba(0,0,0,.38)
}

.portrait-top{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:.2em;
  font-weight:800;
  padding:5px 6px 11px;
  color:#6a5a22
}

.silhouette{
  height:420px;
  background:radial-gradient(320px 220px at 50% 20%,rgba(226,185,92,.32),transparent 65%),linear-gradient(180deg,#132c57,#050f24);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  border-radius:20px
}

.silhouette:before{
  content:"C";
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  font-family:"Fraunces",Georgia,serif;
  font-size:180px;
  line-height:1;
  color:rgba(255,255,255,.06)
}

.silhouette-person{
  position:absolute;
  width:210px;
  height:270px;
  bottom:0;
  background:linear-gradient(180deg,#0b1b38,#030816);
  border-radius:120px 120px 0 0;
  box-shadow:0 0 0 1px rgba(255,255,255,.08)

  border:1px solid rgba(226,185,92,.4);
  border-left:3px solid #e2b95c;
  padding:13px 16px;
  display:flex;
  gap:14px;
  align-items:center;
  z-index:60;
  max-width:92vw;
  border-radius:999px;
  box-shadow:0 18px 40px rgba(0,0,0,.3)
}

.toast button{
  border:0;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:18px;
  width:30px;
  height:30px;
  border-radius:50%;
  line-height:1
}

@media(max-width:1024px){
  .desktop-nav{
    display:none
  }

  .mobile-nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 16px;
    background:#040a1c;
    border-bottom:1px solid rgba(255,255,255,.08);
    scrollbar-width:none
  }

  .mobile-nav::-webkit-scrollbar{
    display:none
  }

  .mobile-nav button{
    flex:0 0 auto;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);
    color:#e8e4d7;
    padding:9px 14px;
    border-radius:999px;
    font-weight:700;
    font-size:13px
  }

  .mobile-nav button.nav-active{
    background:#e2b95c;
    color:#07122a;
    border-color:#e2b95c
  }

  .hero-inner{
    grid-template-columns:1fr;
    gap:36px;
    padding-top:48px
  }

  .portrait-wrap{
    max-width:580px;
    width:100%;
    margin:auto
  }

  .quick-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .medal-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .life-grid,.union-grid,.join-grid{
    grid-template-columns:1fr
  }

  .life-quote-card{
    position:static
  }

  .footer-main{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:640px){
  .topbar{
    padding:10px 16px
  }

  .brand-text small{
    font-size:8px
  }

  .brand-text strong{
    font-size:16px
  }

  .header-cta{
    padding:10px 14px
  }

  .hero-inner{
    padding:44px 16px 56px
  }

  .hero-stats{
    gap:18px
  }

  .quick-section,.life-section,.medals-section,.memory-section,.union-section,.media-section,.news-section,.timeline-section,.join-section{
    padding:56px 16px
  }

  .quick-grid,.medal-grid,.remembrance-grid,.media-grid,.news-grid,.mission-cards{
    grid-template-columns:1fr
  }

  .life-points{
    grid-template-columns:1fr
  }

  .field-row{
    grid-template-columns:1fr
  }

  .footer-main{
    grid-template-columns:1fr
  }

  .floating-quote{
    left:18px;
    right:18px;
    bottom:66px
  }

  .silhouette{
    height:380px
  }

  .join-form{
    padding:22px 18px
  }

  .toast{
    border-radius:18px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --paper:#070e1d;
    --card:#0d182e;
    --ink:#edf1f7;
    --muted:#a5afbf;
    --line:rgba(255,255,255,.12);
    --shadow:0 18px 45px rgba(0,0,0,.35)
  }

  .life-copy p{
    color:#b9c2d0
  }

  .lead{
    color:var(--ink)!important
  }

  .join-form{
    background:#f8f7f2;
    color:#10253f
  }

  .union-section{
    background:#0a1326
  }

  .medal-card small,.news-card>span,.section-label,.section-head>span{
    color:#f6df9a
  }
}

/* ——— ENTERPRISE REBUILD (overrides above) ——— */

:root{
  --bg:#F8F8F7;
  --card:#ffffff;
  --ink:#0F1113;
  --muted:#62666B;
  --line:#E7E6E2;
  --red:#A31621;
  --red-soft:#F7ECEC;
  --gold:#C6A15B;
  --gold-soft:#F7F1E3;
  --shadow:0 12px 34px rgba(15,17,19,.06)
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Archivo","Manrope",system-ui,-apple-system,sans-serif
}

button{
  font-family:inherit
}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:3px solid var(--red);
  outline-offset:2px
}

.app-shell{
  min-height:100vh;
  background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);
  overflow-x:clip
}

.announce{
  background:#0F1113;
  color:#fff;
  text-align:center;
  font-size:12px;
  letter-spacing:.08em;
  font-weight:600;
  padding:9px 16px
}

.announce b{
  color:#E8C87E;
  font-weight:700
}

.topbar{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:40;
  min-height:68px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:10px 24px;
  border-bottom:1px solid var(--line)
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  background:none;
  color:var(--ink);
  text-align:left;
  padding:0
}

.brand-mark{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:#0F1113;
  color:#fff;
  font-weight:800;
  font-size:15px;
  letter-spacing:.02em
}

.brand-mark i{
  font-style:normal;
  color:var(--gold)
}

.brand-text{
  display:flex;
  flex-direction:column;
  gap:1px
}

.brand-text small{
  font-size:9px;
  line-height:1.3;
  letter-spacing:.16em;
  color:var(--muted);
  font-weight:700
}

.brand-text strong{
  font-size:17px;
  line-height:1.15;
  font-weight:800;
  letter-spacing:-.01em
}

.desktop-nav{
  display:flex;
  gap:2px;
  background:transparent;
  border:0;
  padding:0;
  border-radius:0
}

.desktop-nav button{
  border:0;
  background:none;
  color:#3E4246;
  font-size:13.5px;
  font-weight:600;
  padding:9px 12px;
  border-radius:999px;
  transition:.2s
}

.desktop-nav button:hover{
  color:var(--ink);
  background:#F1F0ED
}

.desktop-nav button.nav-active{
  color:var(--red);
  background:var(--red-soft)
}

.header-cta{
  background:var(--red);
  color:#fff;
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-weight:700;
  font-size:14px;
  box-shadow:none;
  transition:.2s
}

.header-cta:hover{
  background:#8A111B;
  transform:none
}

.mobile-nav{
  display:none
}

.hero{
  position:relative;
  background:var(--bg);
  color:var(--ink);
  overflow-x:clip;
  border-bottom:1px solid var(--line)
}

.hero:before{
  display:none
}

.hero-inner{
  position:relative;
  max-width:1240px;
  margin:auto;
  padding:58px 24px 52px;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:56px;
  align-items:center
}

.flag-line{
  display:none
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--red);
  font-size:11px;
  line-height:1.45;
  font-weight:800;
  letter-spacing:.16em;
  background:var(--red-soft);
  border:1px solid #F0D9D9;
  padding:8px 12px;
  border-radius:999px;
  max-width:100%
}

.dot{
  width:7px;
  height:7px;
  flex:0 0 7px;
  border-radius:50%;
  background:var(--red);
  box-shadow:none
}

.hero-slogan{
  font-family:inherit;
  font-style:normal;
  font-weight:800;
  font-size:clamp(38px,5.2vw,66px);
  line-height:.98;
  letter-spacing:-.035em;
  background:none;
  -webkit-background-clip:initial;
  background-clip:initial;
  color:var(--ink);
  margin:20px 0 14px
}

.hero h1{
  font-family:inherit;
  font-size:clamp(24px,3vw,32px);
  line-height:1.15;
  letter-spacing:-.01em;
  margin:0;
  font-weight:700;
  color:var(--ink)
}

.hero h1 span{
  color:var(--ink);
  font-style:normal
}

.hero-subtitle{
  font-size:16px;
  font-weight:600;
  margin:14px 0 0;
  color:#3E4246
}

.hero-desc{
  color:var(--muted);
  line-height:1.7;
  font-size:16px;
  max-width:56ch
}

.hero-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:28px
}

.btn-gold,.btn-outline{
  border-radius:999px;
  padding:14px 22px;
  display:inline-flex;
  gap:9px;
  align-items:center;
  font-weight:700;
  font-size:15px;
  transition:.2s
}

.btn-gold{
  background:var(--red);
  color:#fff;
  border:0;
  box-shadow:none
}

.btn-gold:hover{
  transform:translateY(-1px);
  background:#8A111B
}

.btn-outline{
  border:1px solid #D9D8D3;
  background:#fff;
  backdrop-filter:none;
  color:var(--ink)
}

.btn-outline:hover{
  background:#F1F0ED
}

.hero-meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  color:#3E4246;
  font-size:13px;
  margin-top:22px
}

.hero-meta span{
  display:inline-flex;
  gap:7px;
  align-items:center;
  background:#fff;
  border:1px solid var(--line);
  padding:8px 12px;
  border-radius:999px
}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  flex-wrap:nowrap;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding-top:0;
  margin-top:0;
  background:#fff
}

.hero-stats div{
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:22px 20px;
  border-right:1px solid var(--line)
}

.hero-stats div:last-child{
  border-right:0
}

.hero-stats strong{
  font-family:inherit;
  font-size:30px;
  color:var(--ink);
  letter-spacing:-.02em
}

.hero-stats small{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase
}

.dates-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#0F1113;
  color:#fff;
  font-size:13px;
  font-weight:600;
  padding:9px 14px;
  border-radius:999px;
  margin-top:16px
}

.dates-pill i{
  font-style:normal;
  color:var(--gold)
}

.portrait-wrap{
  position:relative
}

.portrait-frame{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
  padding:12px;
  border-radius:24px;
  box-shadow:0 24px 50px rgba(15,17,19,.10)
}

.portrait-top{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:.18em;
  font-weight:800;
  padding:6px 8px 12px;
  color:var(--muted)
}

.silhouette{
  height:460px;
  background:linear-gradient(180deg,#EDECE8,#D9D7D0);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  border-radius:16px
}

.silhouette:before{
  content:"CM";
  position:absolute;
  top:24px;
  left:50%;
  transform:translateX(-50%);
  font-family:inherit;
  font-size:150px;
  line-height:1;
  color:rgba(15,17,19,.06);
  font-weight:800;
  letter-spacing:-.05em
}

.silhouette-person{
  position:absolute;
  width:210px;
  height:270px;
  bottom:0;
  background:#0F1113;
  border-radius:120px 120px 0 0;
  box-shadow:none
}

.silhouette-person span{
  position:absolute;
  width:74px;
  height:74px;
  border-radius:50%;
  background:#0F1113;
  top:-28px;
  left:50%;
  transform:translateX(-50%);
  box-shadow:none
}

.photo-note{
  position:relative;
  text-align:center;
  padding:22px;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  max-width:36ch
}

.photo-note strong{
  font-family:inherit;
  font-size:20px;
  line-height:1.25
}

.photo-note small{
  color:var(--muted)
}

.portrait-bottom{
  padding:14px 8px 4px;
  display:flex;
  flex-direction:column;
  gap:3px
}

.portrait-bottom strong{
  font-family:inherit;
  font-size:18px
}

.portrait-bottom span{
  color:var(--muted);
  font-size:13px
}

.floating-quote{
  position:absolute;
  left:24px;
  right:24px;
  bottom:70px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border:1px solid var(--line);
  border-left:3px solid var(--red);
  color:var(--ink);
  padding:14px 16px;
  border-radius:14px;
  display:flex;
  gap:10px;
  align-items:flex-start;
  font-size:14px;
  line-height:1.5;
  box-shadow:0 14px 30px rgba(15,17,19,.12)
}

.hero-badge{
  position:absolute;
  top:28px;
  left:28px;
  z-index:2;
  background:#0F1113;
  color:#fff;
  font-size:11px;
  letter-spacing:.12em;
  font-weight:700;
  padding:9px 12px;
  border-radius:999px
}

.hero-badge b{
  color:var(--gold)
}

.scroll-hint{
  display:none
}

.quick-section,.life-section,.medals-section,.memory-section,.union-section,.media-section,.news-section{
  max-width:1240px;
  margin:auto;
  padding:72px 24px
}

.timeline-section,.join-section{
  padding:72px 24px
}

.section-label,.section-head>span{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--red);
  font-size:11px;
  letter-spacing:.18em;
  font-weight:800;
  background:transparent;
  border:0;
  padding:0;
  border-radius:0
}

.section-label:before,.section-head>span:before{
  content:"";
  width:22px;
  height:2px;
  border-radius:0;
  background:var(--red)
}

.section-head h2,.life-copy h2,.union-grid h2,.join-copy h2{
  font-family:inherit;
  font-size:clamp(32px,4.2vw,48px);
  line-height:1.05;
  letter-spacing:-.03em;
  margin:16px 0 12px;
  font-weight:800;
  color:var(--ink)
}

.section-head p{
  color:var(--muted);
  line-height:1.65;
  max-width:62ch
}

.section-head.split{
  display:flex;
  justify-content:space-between;
  gap:24px;
  align-items:end;
  flex-wrap:wrap
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-top:30px
}

.quick-card{
  position:relative;
  background:#fff;
  border:1px solid var(--line);
  padding:24px;
  border-radius:20px;
  box-shadow:none;
  overflow:hidden;
  transition:.22s
}

.quick-card:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 34px rgba(15,17,19,.08)
}

.quick-card:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0;
  background:none
}

.quick-card p{
  margin:20px 0 6px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase
}

.quick-card h3{
  font-family:inherit;
  font-size:21px;
  line-height:1.25;
  margin:0
}

.quick-card small{
  display:block;
  color:var(--muted);
  line-height:1.5;
  margin-top:8px
}

.quick-num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:38px;
  height:28px;
  padding:0 9px;
  border-radius:999px;
  background:var(--gold-soft);
  color:#7A5E22;
  font-size:12px;
  font-weight:800
}

.life-grid,.union-grid,.join-grid{
  display:grid;
  grid-template-columns:1.12fr .88fr;
  gap:48px;
  align-items:start
}

.life-copy p{
  line-height:1.75;
  color:#4A4E53
}

.lead{
  font-size:18px;
  line-height:1.65;
  color:var(--ink)!important
}

.life-points{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:26px
}

.life-points>div{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:7px;
  box-shadow:none
}

.life-points strong{
  font-family:inherit;
  font-size:16px
}

.life-points span{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.life-quote-card{
  position:sticky;
  top:96px;
  background:#0F1113;
  color:#fff;
  padding:32px;
  border-radius:20px;
  overflow:hidden;
  box-shadow:none
}

.life-quote-card>svg{
  color:var(--gold)
}

.life-quote-card blockquote{
  font-family:inherit;
  font-size:clamp(28px,3.2vw,38px);
  line-height:1.1;
  margin:18px 0;
  font-weight:800;
  letter-spacing:-.02em
}

.life-quote-card p{
  color:#D6D8DA;
  line-height:1.65
}

.quote-line{
  display:flex;
  height:3px;
  width:110px;
  overflow:hidden;
  border-radius:99px;
  margin:22px 0 12px
}

.quote-line i{
  flex:1
}

.quote-line i:nth-child(1){
  background:#E8C87E
}

.quote-line i:nth-child(2){
  background:#A31621
}

.quote-line i:nth-child(3){
  background:#fff
}

.life-quote-card>span{
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#E8C87E;
  font-weight:800
}

.invitation{
  background:#fff;
  border:1px solid var(--line);
  padding:20px 22px;
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:center;
  margin-top:28px;
  border-radius:16px;
  box-shadow:none;
  flex-wrap:wrap
}

.invitation>div{
  display:flex;
  gap:14px;
  align-items:flex-start
}

.invitation>div>svg{
  color:var(--red);
  flex:0 0 auto;
  margin-top:2px
}

.invitation strong{
  font-size:17px
}

.invitation p{
  margin:5px 0 0;
  color:var(--muted);
  line-height:1.55
}

.invitation button{
  border:0;
  background:var(--ink);
  color:#fff;
  font-weight:700;
  padding:12px 16px;
  border-radius:999px;
  white-space:nowrap
}

.timeline-section{
  background:#fff;
  color:var(--ink);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line)
}

.timeline-section .section-head{
  max-width:1240px;
  margin:auto
}

.timeline-section .section-head p{
  color:var(--muted)
}

.timeline{
  max-width:900px;
  margin:44px auto 0;
  position:relative
}

.timeline:before{
  content:"";
  position:absolute;
  left:27px;
  top:8px;
  bottom:8px;
  width:1px;
  background:var(--line)
}

.timeline-item{
  position:relative;
  padding:0 0 8px 78px
}

.timeline-item:last-child{
  padding-bottom:0
}

.timeline-marker{
  position:absolute;
  left:0;
  top:0;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#fff;
  color:var(--ink);
  display:grid;
  place-items:center;
  box-shadow:none;
  border:1px solid var(--line);
  font-weight:800
}

.timeline-marker span{
  display:none
}

.timeline-marker b{
  display:block;
  font-size:14px;
  letter-spacing:.02em
}

.timeline-content{
  background:transparent;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  padding:6px 0 28px
}

.timeline-item:last-child .timeline-content{
  border-bottom:0;
  padding-bottom:0
}

.timeline-date{
  display:inline-block;
  background:var(--red-soft);
  border:0;
  color:var(--red);
  font-size:12px;
  font-weight:800;
  letter-spacing:.05em;
  padding:6px 10px;
  border-radius:999px;
  margin-bottom:10px

}

.admin-panel-grid .security-card{
  grid-column:1/-1
}

.admin-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px
}

.admin-card.wide{
  grid-column:1/-1
}

.admin-card h3{
  margin:0 0 12px;
  font-size:18px
}

.admin-card p{
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid #f0efeb;
  padding:9px 0;
  margin:0;
  font-size:14px
}

.admin-card p span{
  color:var(--muted);
  text-align:right
}

.admin-card .muted,.muted{
  color:var(--muted);
  line-height:1.55;
  font-size:14px
}

.security-head{
  display:flex;
  gap:12px;
  align-items:flex-start
}

.security-head svg{
  color:#1d6b3a;
  flex:0 0 auto
}

.security-head h3{
  margin:0
}

.security-head span{
  color:var(--muted);
  font-size:13px
}

.security-card ul{
  list-style:none;
  padding:0;
  margin:14px 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.security-card li{
  display:flex;
  gap:9px;
  align-items:flex-start;
  background:#f8f8f7;
  border:1px solid var(--line);
  padding:12px;
  border-radius:12px;
  line-height:1.5;
  font-size:14px
}

.security-card li svg{
  color:#1d6b3a;
  flex:0 0 auto;
  margin-top:2px
}

.security-warn{
  display:flex;
  gap:8px;
  align-items:flex-start;
  background:#fff7e6;
  border:1px solid #f0d48b;
  padding:12px;
  border-radius:12px;
  color:#6a4d00!important
}

.security-warn svg{
  flex:0 0 auto
}

.admin-two{
  display:grid;
  grid-template-columns:1fr 1.1fr;
  gap:16px;
  align-items:start
}

.admin-form{
  background:#f8f8f7;
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:13px
}

.admin-form h3{
  margin:0
}

.admin-form label,.admin-list h3{
  font-size:13px;
  font-weight:800;
  display:flex;
  flex-direction:column;
  gap:7px
}

.admin-form input,.admin-form textarea{
  border:1px solid #d9d8d3;
  padding:12px 13px;
  border-radius:11px;
  font-family:inherit;
  font-size:14px;
  background:#fff;
  width:100%
}

.admin-form label small{
  color:var(--muted);
  font-weight:500
}

.kind-row{
  display:flex;
  gap:8px
}

.kind-row button{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 16px;
  border-radius:999px;
  font-weight:800
}

.kind-row button.kind-active{
  background:#07122a;
  color:#fff
}

.admin-list{
  display:flex;
  flex-direction:column;
  gap:10px
}

.admin-list article{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:start;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px
}

.admin-list article>div{
  min-width:0
}

.admin-list b{
  display:block;
  line-height:1.35
}

.admin-list span{
  color:var(--muted);
  font-size:12px
}

.admin-list p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:6px 0 0
}

.admin-list article button{
  display:inline-flex;
  gap:6px;
  align-items:center;
  border:0;
  background:#fff1f1;
  color:#a12a2a;
  padding:8px 11px;
  border-radius:999px;
  font-weight:800;
  white-space:nowrap
}

.table-wrap{
  overflow-x:auto
}

.table-wrap table{
  width:100%;
  border-collapse:collapse;
  min-width:640px
}

.table-wrap th{
  text-align:left;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  padding:10px;
  border-bottom:1px solid var(--line)
}

.table-wrap td{
  padding:12px 10px;
  border-bottom:1px solid #f0efeb;
  vertical-align:top
}

.table-wrap td b{
  display:block
}

.table-wrap td small{
  display:block;
  color:var(--muted);
  line-height:1.45;
  margin-top:4px;
  max-width:260px
}

.status-pill{
  background:#fff3cd;
  color:#6a4d00;
  padding:6px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap
}

.mini-btn{
  border:1px solid var(--line);
  background:#fff;
  padding:7px 10px;
  border-radius:999px;
  font-weight:700;
  margin:0 4px 4px 0
}

.mini-btn.danger{
  color:#a12a2a;
  background:#fff1f1;
  border-color:#ffd6d6
}

.media-link,.news-image-link{
  word-break:break-all;
  color:var(--muted);
  font-size:12px
}

@media(max-width:1024px){
  .admin-layout{
    grid-template-columns:1fr
  }

  .admin-sidebar{
    display:none
  }

  .admin-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:12px;
    scrollbar-width:none
  }

  .admin-tabs button{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:#fff;
    padding:10px 14px;
    border-radius:999px;
    font-weight:700
  }

  .admin-tabs button.active{
    background:#07122a;
    color:#fff
  }

  .admin-stats{
    grid-template-columns:repeat(2,1fr)
  }

  .admin-lock-card{
    grid-template-columns:1fr
  }

  .admin-panel-grid,.admin-two{
    grid-template-columns:1fr
  }

  .security-card ul{
    grid-template-columns:1fr
  }
}

@media(max-width:640px){
  .admin-section{
    padding:56px 16px
  }

  .admin-stats{
    grid-template-columns:1fr 1fr
  }

  .admin-lock-card{
    padding:20px
  }

  .header-actions .admin-mini{
    display:none
  }
}
